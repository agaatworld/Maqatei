# Which sites can the app read? (run by hand: Actions → Sites → Run workflow). The table goes to the ci-latest pre-release.
name: Sites
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -U yt-dlp
      - run: python tests/sites.py | tee sites.txt
      - name: Share the table on the ci-latest pre-release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view ci-latest >/dev/null 2>&1 || gh release create ci-latest --prerelease --title "CI results (not an app release)" --notes "Screenshots and logs from the latest automatic test."
          gh release upload ci-latest sites.txt --clobber
