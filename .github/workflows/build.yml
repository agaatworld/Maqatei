name: Build Maqati APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (Python + ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q numpy onnxruntime onnx      # music removal (the test uses a tiny stand-in model)
      - name: No test-only hacks left in the app (lesson from v3.3.0)
        run: "! grep -rn 'TEST ONLY\\|test-only\\|__test__' engine/app --include=*.py --include=*.js"
      - name: Transcription pipeline
        run: |
          set -o pipefail
          python tests/test_transcribe_pipeline.py 2>&1 | tee engine-tests.log
      - name: All main features (cuts, lock, transcripts, search, notes, projects, export, tasks, Wi-Fi)
        run: |
          set -o pipefail
          python tests/test_regression.py 2>&1 | tee -a engine-tests.log
      - name: Share the test log on the ci-latest pre-release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-latest >/dev/null 2>&1 || gh release create ci-latest --prerelease --title "CI results (not an app release)" --notes "Screenshots and logs from the latest automatic test."
          gh release upload ci-latest engine-tests.log --clobber
      - run: node --check engine/app/static/app.js

  apk:
    name: Build and test on an Android emulator
    needs: engine-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          mkdir -p smoke-out
          set -o pipefail
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee smoke-out/gradle.log
      - name: Name the APKs
        run: |
          V=$(sed -n 's/VERSION = "\(.*\)"/\1/p' engine/app/version.py)
          echo "VERSION=$V" >> $GITHUB_ENV
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp app/build/outputs/apk/release/app-$abi-release.apk dist/maqati-$V-$abi.apk
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: maqati-apk
          path: dist/*.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Smoke test on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tests/android/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke-out/
      - name: Share test results (screenshots and logs) on the ci-latest pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd smoke-out && tail -c 400000 gradle.log > gradle-tail.log 2>/dev/null || true
          zip -q -r ../ci-results.zip . -x gradle.log || true
          cd ..
          gh release view ci-latest >/dev/null 2>&1 || gh release create ci-latest --prerelease --title "CI results (not an app release)" --notes "Screenshots and logs from the latest automatic test."
          gh release upload ci-latest ci-results.zip --clobber
      - name: Publish release (once per version)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          python3 tests/release_notes.py "$VERSION" > notes.md
          gh release create "$TAG" dist/maqati-$VERSION-arm64-v8a.apk dist/maqati-$VERSION-armeabi-v7a.apk \
            --target "${{ github.sha }}" --title "مقاطع $VERSION" --notes-file notes.md
