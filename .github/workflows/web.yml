# Keeps the web version (iPhone and computer: the same Maqati running in the browser) up to date in open/.
# GitHub Pages publishes the main branch, so it is at https://agaatworld.github.io/Maqatei/open/
name: Web version
on:
  push:
    branches: [main]
    paths: ["engine/app/**", "web/**", ".github/workflows/web.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: web, cancel-in-progress: false }
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 web/build.py open
      - name: Save open/ if it changed
        run: |
          git add -A open
          if git diff --cached --quiet; then echo "open/ is up to date"; exit 0; fi
          git config user.name "maqati-bot"; git config user.email "maqati-bot@users.noreply.github.com"
          git commit -qm "web version: rebuild open/"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done; exit 1
