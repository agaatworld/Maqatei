# Publishes the iPhone / PC web version (the same Maqati, running in the browser) to GitHub Pages:
# https://beaconcrest8.github.io/maqati/
name: Web version
on:
  push:
    branches: [main]
    paths: ["engine/app/**", "web/**", ".github/workflows/web.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: { group: web, cancel-in-progress: true }
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 web/build.py site
      - name: Publish to the gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "maqati-bot"; git config user.email "maqati-bot@users.noreply.github.com"
          git add -A && git commit -qm "web ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Point GitHub Pages at the web version
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api repos/${{ github.repository }}/pages --jq '.source' || true
          gh api -X PUT repos/${{ github.repository }}/pages -f "source[branch]=gh-pages" -f "source[path]=/" \
            || gh api -X POST repos/${{ github.repository }}/pages -f "source[branch]=gh-pages" -f "source[path]=/" || true
          gh api repos/${{ github.repository }}/pages --jq '.source, .html_url' || true
